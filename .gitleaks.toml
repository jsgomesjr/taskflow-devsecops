title = "Gitleaks - TaskFlow"

# Mantem todas as regras padrao do Gitleaks e acrescenta as regras abaixo.
[extend]
useDefault = true

# As regras padrao nao detectam a SECRET_KEY da linha de base (valor com
# entropia baixa). Esta regra fecha essa lacuna para o padrao do Flask.
[[rules]]
id = "flask-secret-key-hardcoded"
description = "SECRET_KEY do Flask com valor literal no codigo"
regex = '''(?i)\[\s*["']SECRET_KEY["']\s*\]\s*=\s*["']([^"']{8,})["']'''
secretGroup = 1
keywords = ["secret_key"]

# Segredo em ENV/ARG fica gravado nas camadas da imagem (docker history).
[[rules]]
id = "dockerfile-secret-in-env-arg"
description = "Segredo gravado em ENV ou ARG de Dockerfile"
path = '''(?i)(^|/)Dockerfile[^/]*$'''
regex = '''(?im)^\s*(?:ENV|ARG)\s+\w*(?:PASSWORD|SECRET|TOKEN|API_KEY)\w*\s*=\s*["']?([^\s"']+)'''
secretGroup = 1
keywords = ["password", "secret", "token", "api_key"]

# Excecao didatica prevista nas Rubricas Gerais (secao 2c): a SECRET_KEY do
# app.py e o ADMIN_PASSWORD do Dockerfile originais da TaskFlow estao no
# historico por design, no commit de importacao da linha de base. Os dois
# valores sao publicos (vem do repositorio da disciplina), nunca protegeram
# nada real e foram removidos do codigo atual (SECRET_KEY agora vem de
# variavel de ambiente; ADMIN_PASSWORD e injetado em runtime).
# A excecao exige as DUAS condicoes ao mesmo tempo (condition = AND):
# o commit da linha de base E um dos dois valores exatos. Qualquer outro
# segredo, inclusive nesse mesmo commit, continua reprovando o gate.
[[allowlists]]
description = "Segredos didaticos da linha de base da TaskFlow (commit de importacao)"
condition = "AND"
commits = ["b323e5f0b29584a8f69f6bc433bcfc45620098e1"]
regexTarget = "secret"
regexes = [
  '''^s3gr3d0-super-secreto-nao-mude-nunca$''',
  '''^admin123$''',
]
