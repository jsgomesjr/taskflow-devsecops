name: Container

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERFILE: Dockerfile
  IMAGE: taskflow:${{ github.sha }}

jobs:
  imagem:
    name: Container - build e Trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build da imagem
        run: docker build --pull --file "$DOCKERFILE" --tag "$IMAGE" .

      - name: Trivy na imagem (gate HIGH,CRITICAL)
        uses: ./.github/actions/trivy-scan
        with:
          scan-type: image
          scan-ref: ${{ env.IMAGE }}

      - name: Trivy na configuracao do Dockerfile (gate HIGH,CRITICAL)
        uses: ./.github/actions/trivy-scan
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig

      - name: Subir o container com as flags seguras e testar a aplicacao
        run: |
          TASKFLOW_SECRET_KEY="$(openssl rand -hex 32)"
          TASKFLOW_ADMIN_PASSWORD="$(openssl rand -hex 16)"
          TASKFLOW_ALUNO_PASSWORD="$(openssl rand -hex 16)"
          export TASKFLOW_SECRET_KEY TASKFLOW_ADMIN_PASSWORD TASKFLOW_ALUNO_PASSWORD
          scripts/docker-run-seguro.sh "$IMAGE"
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-all-errors \
            --output /dev/null http://127.0.0.1:5000/login
          curl --fail --silent --show-error --output /dev/null --write-out "%{redirect_url}\n" \
            --data-urlencode "username=admin" --data-urlencode "password=${TASKFLOW_ADMIN_PASSWORD}" \
            http://127.0.0.1:5000/login | grep --quiet "/tasks$"
          echo "Login com o container endurecido funcionando."

      - name: Logs do container
        if: always()
        run: docker logs taskflow-seguro || true
