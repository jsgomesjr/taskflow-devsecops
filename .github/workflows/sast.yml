name: SAST

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Semgrep (p/python, p/flask, p/security-audit) bloqueando com --error
        run: >-
          semgrep scan
          --config=p/python
          --config=p/flask
          --config=p/security-audit
          --error
          --metrics=off

  gitleaks:
    name: Secret Scanning - Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout do codigo com historico completo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks em todo o historico do Git (regras padrao + .gitleaks.toml)
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo"
          "$GITLEAKS_IMAGE"
          git /repo
          --config /repo/.gitleaks.toml
          --redact
          --verbose
          --no-banner
